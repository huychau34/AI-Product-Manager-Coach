const U={"llm": ["An LLM (large language model) is trained on huge amounts of text to do one thing: predict the next token. A token is a word or a piece of a word, and everything about an LLM - how much it can read, how much it writes, what it costs and how fast it is - is measured in tokens. It has no database of facts; it generates plausible text from patterns it learned.", "That design creates limits you must plan around. The <b>context window</b> is the model's working memory for one request; beyond it, earlier content is dropped or must be summarised. It has a <b>knowledge cutoff</b>, so it doesn't know recent events unless you give them to it. It is <b>non-deterministic</b>: the same input can produce different outputs. And it can <b>hallucinate</b> - write fluent, confident text that is wrong - because it optimises for plausible, not true.", "The product implication: design for verification, not blind trust. Ground answers in your own data, show sources, let users edit and undo, allow the model to say \"I don't know\", and keep humans on high-stakes decisions. Remember that cost and latency grow with tokens, so long prompts and long chats cost more. Good questions for your engineers: which context window do we use, what happens when we exceed it, and how do we measure the hallucination rate?"], "prompt": ["A prompt is the spec you give the model. Strong prompts include a <b>role</b> (who the model is acting as), <b>context</b> (background and data), the <b>task</b>, <b>constraints</b> (tone, length, what not to do) and the <b>output format</b>. Treat it like a product brief: a vague brief gets a vague result.", "A few techniques do most of the work. <b>Few-shot examples</b> show the model the style you want and how to handle edge cases. <b>Structured output</b> (for example JSON with a defined schema) makes results usable by software. Breaking complex work into steps (<b>prompt chaining</b>), asking the model to reason before answering, and telling it what to do when it's unsure all make results more reliable.", "For PMs, prompts are the cheapest prototype there is: you can test an idea on 20 real examples in an afternoon before any engineering starts. In production, prompts are product assets - version them and re-run your test set whenever they change, because one sentence can shift behaviour. And know the limits: prompting can't fix missing data, or a model that is too slow or expensive for the job."], "disc": ["Start from the user problem, not the technology. AI fits where inputs are fuzzy (language, images, messy data), where a good-enough answer is still valuable, and where there are real patterns in data to learn from. Traditional rules-based software is better when the answer must be exact, fully explainable or legally binding.", "Next, decide whether to <b>automate</b> or <b>augment</b>. Automate tasks that are tedious, repetitive and low-risk, with an agreed right answer. Augment - help a person do it better - when judgement, accountability or enjoyment matter. Also ask which error is worse for users: a <b>false positive</b> (AI acts when it shouldn't) or a <b>false negative</b> (AI misses something). That choice shapes the whole design.", "Data readiness is usually the real gate. Do you have the data, can you access it, is it clean and representative, and are you allowed to use it (privacy, contracts, customer consent, sending it to a third-party model)? Validate cheaply before committing: run a prompt prototype on real samples, or fake it with a human behind the scenes, and measure how often the output is good enough."], "roi": ["AI ROI comes down to value per task minus cost per task, multiplied by volume. Value can be time saved, higher quality, extra revenue or lower risk. Cost includes inference (API tokens), infrastructure, human review, the cost of errors, and the build plus ongoing maintenance - monitoring, evaluation and prompt updates.", "Watch the hidden costs. Correction time eats savings: if 30% of AI drafts need heavy fixing, the average saving can be close to zero. Edge cases take a disproportionate share of effort. And unlike traditional software, AI has a <b>variable cost per use</b>, so heavy usage directly affects gross margin and how you should price the feature.", "Estimate ROI with a pilot rather than a spreadsheet alone. Baseline today's time and quality, run the AI on a real sample, and measure acceptance rate, correction time, error rate and cost per task. Then test sensitivity: which assumption would flip the business case? Your levers are a cheaper model, narrower scope, caching, and human review only where the risk is high."], "pat": ["There are three common patterns, ordered by autonomy. A <b>copilot</b> suggests inside the user's workflow and the user accepts or edits (autocomplete, draft replies). An <b>assistant</b> answers or performs a task when asked, usually in a chat or side panel. An <b>agent</b> is given a goal, plans multiple steps, uses tools such as search or APIs, and acts with less supervision.", "More autonomy means more value per interaction, but also more risk. Errors compound across steps, some actions can't be undone, agents are harder to debug, and they cost more and take longer. Many problems are better solved by a fixed <b>workflow</b> - predefined steps that call an LLM - than by an open-ended agent.", "Design principle: start with the lowest autonomy that delivers value, then earn trust. Require human approval for high-impact actions (money, deletion, messages to customers), give clear permissions, keep logs of what the AI did and why, make undo easy and failures graceful. Tell users what the AI can do and how to correct it."], "rag": ["<b>Embeddings</b> turn text into lists of numbers (vectors) where similar meanings sit close together. That's how a search for \"refund policy\" can find a document about \"returns and money back\" without matching keywords. A <b>vector database</b> stores these vectors and finds the closest ones quickly.", "<b>RAG</b> (retrieval-augmented generation) works in two steps. Beforehand, documents are split into chunks, embedded and indexed. When a user asks something, the system retrieves the most relevant chunks, puts them into the prompt, and the LLM answers from them - and can cite them. No retraining is needed; you update knowledge by re-indexing. Fine-tuning is better for changing behaviour or style, not for facts that change often.", "Answer quality depends mostly on retrieval: poor chunking, stale or conflicting documents, or missing permissions lead to wrong answers. PM decisions include which sources are in scope and who owns them, how fresh they must be, access control (users should only retrieve what they're allowed to see), showing citations, and what to say when nothing relevant is found. Measure retrieval quality separately from answer quality."], "eval": ["AI output varies, so \"it looked good in the demo\" is not evidence. An <b>eval</b> is a repeatable test: a set of realistic inputs, the expected answers or grading criteria, and a score. It's the AI version of acceptance criteria and regression tests - and the PM owns the definition of \"good\".", "To build one, start with 20-50 real cases, including edge cases and known failures. Read real outputs first (<b>error analysis</b>) to find the ways the feature actually fails, then define specific, measurable criteria. Grade with code where you can (exact match, valid format), with an LLM judge and a clear rubric for nuanced quality, and with humans for subjective or high-stakes calls.", "In production, pair offline evals with live signals: acceptance rate, edit rate, thumbs up/down, escalations and task completion, plus latency and cost per task. Re-run evals whenever the prompt, model or data changes, and agree launch thresholds with stakeholders before you see the results, not after."], "strat": ["Models are becoming commodities: your competitors can use the same models you do, so the model alone is rarely a moat. Durable advantage comes from <b>proprietary data and feedback loops</b>, deep <b>workflow integration</b>, distribution, trust, and domain expertise.", "On <b>build vs buy</b>: buy (use a vendor or API) when AI isn't your differentiator and speed matters; build or customise where it's core to your value, where data is sensitive, or where unit economics at scale demand it. Either way, keep your architecture model-agnostic so you can switch vendors as price and quality change.", "AI changes economics: every use has a cost, which affects margins and pricing (per seat, per usage, or per outcome). Track adoption (active use, retention) together with quality (acceptance, accuracy) and cost (cost per task, gross margin). Retention is the real test - many AI features see a spike of curiosity and then drop off."], "pjob": ["AI PM interviews usually combine classic product sense with AI judgement. Expect to design an AI feature, critique an existing one, handle a hallucination incident, explain a technical concept simply, and discuss metrics and trade-offs.", "A reliable structure: clarify the user and problem, then explain why AI (rather than rules), choose a pattern (copilot, assistant or agent) and the data it needs, name the risks (hallucination, bias, privacy, safety) with mitigations, describe the evaluation plan and launch criteria, and finish with success metrics and how you'd iterate. Interviewers reward clear trade-offs over buzzwords.", "An AI PRD adds sections a normal PRD lacks: expected model behaviour with examples of good and bad output, data sources and access, evaluation criteria and thresholds, failure handling and fallback UX, human oversight, a cost-per-task budget, and post-launch monitoring. Writing one for a real idea is excellent interview prep and portfolio material."]};

le", "Take one workflow at {x} and sketch it as a copilot, an assistant and an agent. Which would you ship first?"], ["Trade-off", "What would need to be true (accuracy, logs, undo) before you'd give the AI more autonomy?"], ["What if", "An agent took a wrong action for a customer. What should the product show them, and what happens next?"]], "rag": [["Apply", "What could go wrong with retrieval at {x}: stale, missing or conflicting documents?"], ["Real example", "Which internal knowledge source at {x} would you index first, and who owns keeping it up to date?"], ["Trade-off", "When, if ever, would fine-tuning be a better choice than RAG for your use case?"], ["What if", "The assistant can't find any relevant document. What should it say and do?"]], "eval": [["Apply", "Which 10 test cases would you write first for an AI feature at {x}? Include at least two edge cases."], ["Define", "Define 'good' for one AI output in your product as three specific, measurable criteria."], ["Trade-off", "Which matters more for your feature, accuracy or speed? What threshold would block a launch?"], ["What if", "Which live signals would tell you quality dropped after a model update?"]], "strat": [["Apply", "What would make you switch model vendors, and how hard would it be today?"], ["Real example", "What data or workflow does {x} have that a competitor using the same model couldn't copy?"], ["Decide", "Build or buy for your most important AI feature? Give your top two reasons."], ["Metrics", "Pick one adoption, one quality and one cost metric for your AI roadmap. Why these?"]], "pjob": [["Apply", "Write a one-page PRD outline for one idea from this roadmap. Which section was hardest?"], ["Practise", "Answer out loud in two minutes: 'Design an AI feature for {x}.' What would you improve?"], ["Story", "Prepare a story about a trade-off you made (speed vs quality, scope vs risk). How does it apply to AI products?"], ["Explain it", "How would you explain RAG or embeddings to a hiring man
